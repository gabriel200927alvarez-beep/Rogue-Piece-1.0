name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Instalar dependencias incompatibles
        run: |
          npm install --save-dev esbuild@0.28.2 --legacy-peer-deps
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps

      - name: Corregir rutas de entrada
        run: |
          sed -i 's|/src/main\.tsx|./main.tsx|' index.html
          sed -i "s|'./game/gameLoop\.ts'|'./gameLoop.ts'|" main.tsx

      - name: Compilar aplicación web
        run: npm run build

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Crear APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Rogue-Piece-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
